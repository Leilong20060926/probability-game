<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>紀錄與統計 · 黃金探勘所</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/route.css"></head>
<body>
<main class="admin-page">
  <p id="back-player"><a href="/">← 回玩家頁</a></p><h1>紀錄與統計</h1>
  <p>不記錄試玩不會出現在這裡。切換頁面不會暫停探勘；按重新整理取得最新資料。</p>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="records">
    <form id="filters">
      <label>配置 ID <input name="configId"></label>
      <label>模式 <select name="mode"><option value="">全部</option><option>server</option><option>local</option><option>unverified_local</option></select></label>
      <label>結束原因 <select name="reason"><option value="">全部</option><option value="gold">金礦</option><option value="timeout">超時</option><option value="exhausted">耗盡</option><option value="abandoned">提前結束</option></select></label>
      <button>套用篩選／重新整理</button>
    </form>
    <div id="stats"></div>
    <p><button data-export="export">下載局次 CSV</button> <button data-export="events">下載事件 CSV</button></p>
    <p id="page-info"></p>
    <div class="table-scroll"><table><thead><tr><th>遊戲</th><th>玩家</th><th>次數</th><th>規則／版本／配置</th><th>地圖進度</th><th>狀態</th><th>結束原因</th><th>分數</th><th>動作數</th><th>耗時（秒）</th><th class="record-operation">操作</th></tr></thead><tbody id="games"></tbody></table></div>
    <p><button id="previous">上一頁</button> <button id="next">下一頁</button></p>
  </section>
</main><script type="module" src="/src/admin.js"></script>
</body></html>
